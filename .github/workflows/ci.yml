name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node --check public/app.mjs
      - run: node scripts/build-demo.mjs
      - name: Accepted demo deployment checks
        if: runner.os == 'Linux' && matrix.node == '22'
        run: python3 -m unittest discover -s tests -p 'test_prepare_pages.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-demo-${{ matrix.os }}-${{ matrix.node }}
          path: dist
